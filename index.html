<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="estilos/mediaquery.css">
    <link rel="stylesheet" href="estilos/style.css">

</head>
<body>
    <main>
        <section id="login">
            <div id="imagem" >
                
            </div>
            <div id="formulario" >
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu  ambiente.</p>
                <form action="login.php" method="post" autocomplete="on" >

                    <div class="campo">
                        <i class="material-icons" >person</i>
                        <input type="email" name="email" id="iemail" placeholder="E-mail" autocomplete="email" required maxlength="30"  >
                        <label for="iemail">Login</label><br>

                        <i class="material-icons" >vpn_key</i>
                        <input type="password" name="sen" id="isen" placeholder="Sua senha" required  minlength="8" maxlength="20" autocomplete="current-password" >
                        <label for="isen">Senha</label>
                    </div>

                    <input type="submit" value="Enviar">
                    <a href="esqueci_senha">Esqueci senha <i class="material-icons" >mail</i> </a>

                </form>

            </div>
        </section>
    </main>
</body>
</html>
